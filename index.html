<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MR Schaffplang</title>
<meta name="description" content="Arbeitsplan der Maison Relais">
<meta name="theme-color" content="#0e2841">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Schaffplang">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --navy:#0e2841; --blue:#156082; --orange:#e97132; --red:#d0021b; --yellow:#fff3a3;
  --bg:#f3f5f8; --card:#fff; --text:#1b2430; --muted:#6b7480; --line:#dfe3e8;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.35;-webkit-text-size-adjust:100%}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
small{font-size:.8em;color:var(--muted)}
a{color:var(--blue)}

/* ---------- Login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:linear-gradient(160deg,var(--navy),#1b4a6b)}
.lbox{background:var(--card);border-radius:16px;padding:26px 22px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.lbox h1{margin:0 0 4px;font-size:22px;color:var(--navy)}
.lbox img.logo{display:block;width:230px;max-width:80%;margin:0 auto 14px}
.lbox p.sub{margin:0 0 18px;color:var(--muted)}
.lbox label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.lbox input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:16px}
.lbox button.primary{width:100%;margin-top:16px}
.lbox .switch{margin-top:14px;text-align:center;font-size:14px}
.err{background:#fde8e8;color:#9b1c1c;border-radius:8px;padding:9px 12px;margin-top:12px;font-size:14px}
.ok{background:#e6f6ea;color:#1a6b30;border-radius:8px;padding:9px 12px;margin-top:12px;font-size:14px}

/* ---------- Buttons ---------- */
button.primary{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:600}
button.primary:disabled{opacity:.6}
button.ghost{background:#fff;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
button.danger{background:#fff;color:var(--red);border:1px solid #f1b9b9;border-radius:8px;padding:9px 12px}
button.icon{background:transparent;border:0;color:#fff;font-size:20px;padding:6px 10px;border-radius:8px}
button.icon:active{background:rgba(255,255,255,.15)}

/* ---------- Header ---------- */
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 6px 14px;gap:8px}
.bar .title{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .left{display:flex;align-items:center;gap:10px;min-width:0}
.bar img.hlogo{display:none;height:32px;background:#fff;border-radius:6px;padding:3px 7px;box-sizing:content-box}
@media(min-width:700px){.bar img.hlogo{display:block}}
.bar .right{display:flex;align-items:center;gap:2px}
.tabs{display:flex;gap:4px;padding:0 10px 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:999px;padding:6px 12px;font-size:14px}
.tabs button.active{background:#fff;color:var(--navy);font-weight:600}
.weeknav{display:flex;align-items:center;justify-content:center;gap:6px;background:#fff;color:var(--text);border-bottom:1px solid var(--line);padding:6px 8px}
.weeknav .wl{font-weight:700;min-width:170px;text-align:center}
.weeknav .wl small{display:block;font-weight:400}
.weeknav button.nav{background:#fff;border:1px solid var(--line);border-radius:8px;width:38px;height:36px;font-size:18px}
.weeknav button.today{background:#fff;border:1px solid var(--line);border-radius:8px;height:36px;padding:0 10px;font-size:14px}
.admin-only{display:none}
body.is-admin .admin-only{display:initial}
body.is-admin .tabs.admin-only{display:flex}
body.is-admin .planactions.admin-only{display:flex}

/* ---------- Content ---------- */
main{padding:10px 10px 40px;max-width:1500px;margin:0 auto}
.daytabs{display:flex;gap:4px;margin:2px 0 10px}
.daytabs button{flex:1;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 2px;font-weight:600;color:var(--navy)}
.daytabs button small{display:block;font-weight:400;font-size:11px}
.daytabs button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.daytabs button.active small{color:#cfd8e3}
.daytabs button.istoday{box-shadow:inset 0 -3px 0 var(--orange)}

.mycard{background:var(--card);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px;border:1px solid var(--line)}
.myhead{font-weight:700;color:var(--navy);margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline}
.mydays{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:4px}
.myday{background:var(--bg);border-radius:8px;padding:6px 2px;text-align:center;font-size:13px;overflow:hidden}
.myday.today{outline:2px solid var(--orange)}
.myday>b{display:block}
.myday>small{display:block;margin-bottom:3px}
.myday .cell{justify-content:center;text-align:center;min-height:auto;padding:2px 0;font-size:11.5px;gap:2px 4px}
.myday .cell .t b{font-weight:700}
.myday .badge{font-size:10px;padding:0 5px}

.dayhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;margin-bottom:8px}
.dayhead .roles{display:flex;gap:12px;font-size:14px;align-items:center}
.dayhead .roles[data-action]{cursor:pointer}
.dayhead .pen{color:var(--blue)}
.dayhead .opts{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px}

.grpcard{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);margin-bottom:10px;overflow:hidden}
.grphead{background:var(--gc,#e5e7eb);font-weight:700;padding:6px 12px;color:#1b2430}
.row{display:flex;align-items:center;gap:8px;padding:6px 12px;border-top:1px solid var(--line)}
.row .nm{flex:0 0 118px;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.me{background:#eef6ff}
.row .cell{flex:1}
.row.empty .cell{color:var(--muted)}

.cell{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-height:28px;border-radius:6px;padding:3px 6px;position:relative}
.cell[data-action]{cursor:pointer}
.cell[data-action]:hover{background:rgba(21,96,130,.08)}
.cell .t{white-space:nowrap}
.cell .t b{font-weight:600}
.cell .t b.early,.cell .t b.late{color:var(--red)}
.cell .t b.warn{color:var(--orange)}
.cell .note{font-weight:600;color:#3d4a5c;text-transform:uppercase;letter-spacing:.3px}
.cell.chg{background:var(--yellow)}
.cell.chg::after{content:"";position:absolute;right:3px;top:3px;width:7px;height:7px;border-radius:50%;background:#e0b800}
.cell.new{outline:2px solid #e0b800}
.cell.abs{font-weight:600}
.cell.abs-urlaub,.cell.abs-krank{background:#fbd5d5;color:#8a1c1c}
.cell.abs-formatioun{background:#ffe0b3;color:#7a4b00}
.cell.abs-frei{background:#e5e7eb;color:#4b5563}
.cell.abs-sonstiges,.cell.abs-x{background:#e8dcf2;color:#4a2b6a}
.badge{font-style:normal;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;color:#fff;background:var(--blue)}
.badge.schl{background:var(--navy)}

.gridwrap{display:none;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;max-height:calc(100vh - 150px)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.grid th,table.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:3px 4px;vertical-align:middle}
table.grid thead th{position:sticky;top:0;background:var(--navy);color:#fff;z-index:3;text-align:center;font-size:14px}
table.grid thead th small{color:#cfd8e3;display:block;font-weight:400}
table.grid thead th.today{background:var(--blue)}
table.grid td.today{background:rgba(21,96,130,.06)}
table.grid .name{position:sticky;left:0;background:#fff;z-index:2;font-weight:600;min-width:120px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.grid thead th.name{z-index:4;background:var(--navy);text-align:left}
table.grid tr.grp td{background:var(--gc,#e5e7eb);font-weight:700;position:sticky;left:0}
table.grid tr.emp td.name{background:var(--gc,#fff)}
table.grid tr.emp.me td{background:#eef6ff}
table.grid tr.emp .nm{display:inline-block;border-radius:6px;padding:1px 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
table.grid td .cell{min-height:34px}
table.grid .hrs{text-align:right;white-space:nowrap;font-weight:700;min-width:70px}
table.grid .hrs.over{color:var(--red)}
table.grid .hrs.under{color:var(--orange)}
table.grid tr.role td{background:#f7f9fb}
table.grid tr.role td.name{background:#f7f9fb}
table.grid tr.count td{color:var(--muted);text-align:center}
table.grid tr.count td.name{text-align:left}
.rolesel{width:100%;max-width:140px;padding:3px;border:1px solid var(--line);border-radius:6px;background:#fff}
.rolename{font-weight:600}
.planactions{display:none;gap:8px;margin-top:10px;flex-wrap:wrap}

details.warn{background:#fff8e1;border:1px solid #f3d98b;border-radius:var(--radius);padding:6px 12px;margin-bottom:10px}
details.warn summary{cursor:pointer;font-weight:600;color:#7a5a00}
details.warn ul{margin:6px 0 4px;padding-left:18px}
details.warn li{margin:2px 0}
details.warn li.info{color:var(--muted)}
.noteinfo{background:#e8f1f8;border:1px solid #c8dced;border-radius:var(--radius);padding:8px 12px;margin-bottom:10px;font-size:14px}

/* ---------- Lists / admin pages ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:17px;color:var(--navy)}
.card h2 .cnt{color:var(--muted);font-weight:400;font-size:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar select,.toolbar input{padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th{text-align:left;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:6px 6px}
table.list td{border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:middle}
table.list tr[data-action]{cursor:pointer}
table.list tr:hover td{background:#f7f9fb}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:1px solid rgba(0,0,0,.15)}
.kind{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700}
.kind-urlaub,.kind-krank{background:#fbd5d5;color:#8a1c1c}
.kind-formatioun{background:#ffe0b3;color:#7a4b00}
.kind-frei{background:#e5e7eb;color:#4b5563}
.kind-sonstiges{background:#e8dcf2;color:#4a2b6a}
.help{font-size:14px;color:#3d4a5c}
.help ol{padding-left:20px}
code.url{background:#f1f3f5;padding:2px 6px;border-radius:6px;word-break:break-all}

/* ---------- Forms ---------- */
form.f .frow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:10px 0}
form.f label{font-size:13px;color:var(--muted);min-width:78px}
form.f input,form.f select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:#fff}
form.f input[type=time]{width:112px}
form.f input[type=date]{width:160px}
form.f input[type=text],form.f input[type=email],form.f input[type=number],form.f select{flex:1;min-width:140px}
form.f input[type=number]{max-width:120px}
form.f input[type=color]{width:52px;height:38px;padding:2px}
form.f .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
form.f .chips button{background:#eef2f6;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13px}
form.f .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
form.f .actions .spacer{flex:1}
form.f .check{display:flex;align-items:center;gap:8px;margin:8px 0}
form.f .check input{width:auto}
button.sm{padding:5px 8px;font-size:13px}
td.acts{white-space:nowrap}td.acts button{margin-right:4px}
.muted{color:var(--muted)}
.cred{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.cred>div{flex:1;min-width:160px;background:#f7f9fb;border:1px solid var(--line);border-radius:8px;padding:8px 12px}.cred small{display:block;color:var(--muted);font-size:12px}.cred b{font-size:18px;word-break:break-all;user-select:all}
form.f .frow>span{font-size:15px}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;background:rgba(10,20,35,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
.mbox{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.mbox h3{margin:0 0 6px;color:var(--navy);font-size:18px}
.mbox h3 small{display:block;font-weight:400}
@media(min-width:600px){.modal{align-items:center;padding:20px}.mbox{border-radius:16px}}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b2430;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
#syncdot{width:8px;height:8px;border-radius:50%;background:#7ed957;display:inline-block;margin-right:6px}
#syncdot.off{background:#f4b400}

/* ---------- Desktop ---------- */
@media(min-width:900px){
  .daytabs,.daylist{display:none}
  .gridwrap{display:block}
  .mycard .mydays{grid-template-columns:repeat(7,1fr)}
  main{padding:14px 16px 40px}
}
@media print{
  header,.daytabs,.daylist,.planactions,details.warn,.mycard,#toast{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .gridwrap{display:block;max-height:none;overflow:visible;border:0}
  table.grid{font-size:11px}
  table.grid thead th{position:static;background:#0e2841!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.grid td,table.grid tr.grp td,table.grid tr.emp td.name{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rolesel{border:0;appearance:none;background:transparent}
  @page{size:landscape;margin:8mm}
}
</style>
</head>
<body>

<!-- ===== Login ===== -->
<div id="login" class="hidden">
  <div class="lbox">
    <img src="logo.png" class="logo" alt="Lënster Päiperlék – service d'éducation et d'accueil">
    <h1>MR Schaffplang</h1>
    <p class="sub">Arbeitsplan – Maison Relais</p>
    <form id="fLogin">
      <label>E-Mail</label><input type="email" name="email" autocomplete="username" required>
      <label>Passwort</label><input type="password" name="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Anmelden</button>
      <div id="loginMsg"></div>
    </form>
    <form id="fRegister" class="hidden">
      <label>Dein Name (wie im Plan)</label><input type="text" name="name" autocomplete="name" required>
      <label>E-Mail</label><input type="email" name="email" autocomplete="username" required>
      <label>Passwort (mind. 6 Zeichen)</label><input type="password" name="password" autocomplete="new-password" minlength="6" required>
      <label>Einladungscode</label><input type="text" name="code" autocomplete="off" required>
      <button class="primary" type="submit">Registrieren</button>
      <div id="regMsg"></div>
    </form>
    <div class="switch"><a href="#" id="toRegister">Noch kein Zugang? Registrieren</a><a href="#" id="toLogin" class="hidden">Zurück zur Anmeldung</a></div>
  </div>
</div>

<!-- ===== App ===== -->
<div id="main" class="hidden">
  <header>
    <div class="bar">
      <div class="left"><img src="logo.png" class="hlogo" alt=""><div class="title" id="title">Schaffplang</div></div>
      <div class="right">
        <button class="icon" id="btnReload" title="Aktualisieren">↻</button>
        <button class="icon" id="btnMenu" title="Menü">☰</button>
      </div>
    </div>
    <nav class="tabs admin-only" id="tabs">
      <button data-view="plan" class="active">Plan</button>
      <button data-view="absences">Abwesenheiten</button>
      <button data-view="employees">Mitarbeiter</button>
      <button data-view="logins">Logins</button>
      <button data-view="hours">Stunden</button>
      <button data-view="settings">Einstellungen</button>
    </nav>
    <div class="weeknav" id="weeknav">
      <button class="nav" id="prevWeek" title="Vorherige Woche">‹</button>
      <div class="wl" id="weekLabel"></div>
      <button class="nav" id="nextWeek" title="Nächste Woche">›</button>
      <button class="today" id="todayWeek">Heute</button>
      <button class="today" id="btnPdf" title="Diese Woche als PDF speichern">PDF</button>
    </div>
  </header>
  <main id="content"></main>
</div>

<div id="modal" class="modal hidden"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>

   Hilfsfunktionen

const pad2 = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));
const isoWeek = d => { const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = x.getUTCDay() || 7; x.setUTCDate(x.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(x.getUTCFullYear(), 0, 1)); return Math.ceil((((x - y0) / 86400000) + 1) / 7); };

const fmtT = t => { if (!t) return ''; const [h, m] = t5(t).split(':'); return `${+h}:${m}`; };
const mins = t => { if (!t) return null; const [h, m] = t5(t).split(':').map(Number); return h * 60 + m; };
const fmtH = h => (Math.round(h * 100) / 100).toLocaleString('de-DE', { maximumFractionDigits: 2 });
const DAY_SETS = { fr: ['LU', 'MA', 'ME', 'JE', 'VE', 'SA', 'DI'], de: ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'], lb: ['Méi', 'Dën', 'Mët', 'Don', 'Fre', 'Sam', 'Son'] };
const DAY_LABELS = i => (DAY_SETS[S.settings.day_labels] || DAY_SETS.fr)[i];

function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), ms); }
function openModal(html) { $('#mbox').innerHTML = html; $('#modal').classList.remove('hidden'); const f = $('#mbox input:not([type=hidden]),#mbox select'); if (f && window.innerWidth > 900) f.focus(); }
function closeModal() { $('#modal').classList.add('hidden'); $('#mbox').innerHTML = ''; }
function formData(form) { const o = {}; new FormData(form).forEach((v, k) => { o[k] = typeof v === 'string' ? v.trim() : v; }); return o; }
function errMsg(e) { const m = (e && (e.message || e.error_description || e.msg)) || String(e); return m; }

/* ============================================================
   Start / Login
   ============================================================ */
async function init() {
  if (!window.supabase) { document.body.innerHTML = '<p style="padding:20px">Die App konnte eine benötigte Datei nicht laden. Bitte Internetverbindung prüfen und neu laden.</p>'; return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sb.auth.onAuthStateChange((ev, s) => {
    if (ev === 'SIGNED_OUT') { session = null; profile = null; showLogin(); return; }
    if (s && (!session || s.user.id !== session.user.id)) { session = s; afterLogin(); }
  });
  gotoFromUrl(location.href, true);
  const { data } = await sb.auth.getSession();
  if (data && data.session) { session = data.session; afterLogin(); } else showLogin();
  if ('serviceWorker' in navigator) {
    try { navigator.serviceWorker.register('sw.js'); } catch (e) { }
    try { navigator.serviceWorker.addEventListener('message', ev => { if (ev.data && ev.data.type === 'goto') { gotoFromUrl(ev.data.url, false); if (session) { view = 'plan'; render(); loadAll(); } } }); } catch (e) { }
  }
}
/* ?week=JJJJ-MM-TT (aus einer Push-Meldung): zu dieser Woche springen */
function gotoFromUrl(href, clean) {
  try {
    const u = new URL(href, location.href); const w = u.searchParams.get('week');
    if (w && /^\d{4}-\d{2}-\d{2}$/.test(w)) { const d = parseISO(w); if (!isNaN(d)) { weekStart = mondayOf(d); selDay = Math.min(Math.max(0, (d.getDay() + 6) % 7), 4); } }
    if (clean && w) history.replaceState(null, '', u.pathname);
  } catch (e) { }
}

function showLogin() {
  $('#main').classList.add('hidden'); $('#login').classList.remove('hidden');
  document.body.classList.remove('is-admin');
}

async function afterLogin() {
  const { data: p } = await sb.from('profiles').select('*').eq('user_id', session.user.id).maybeSingle();
  profile = p || { user_id: session.user.id, is_admin: false, employee_id: null, display_name: session.user.email };
  isAdmin = !!profile.is_admin;
  document.body.classList.toggle('is-admin', isAdmin);
  $('#login').classList.add('hidden'); $('#main').classList.remove('hidden');
  try { localStorage.setItem('mr_lastSeen', String(Date.now())); } catch (e) { }
  await loadAll();
  setupRealtime();
  PUSH.sync();
}

$('#toLogin').addEventListener('click', e => { e.preventDefault(); $('#fRegister').classList.add('hidden'); $('#fLogin').classList.remove('hidden'); $('#toLogin').classList.add('hidden'); $('#toRegister').classList.remove('hidden'); });

$('#fLogin').addEventListener('submit', async e => {
  e.preventDefault(); const f = e.target; const d = formData(f); const btn = $('button', f); const msg = $('#loginMsg');
  btn.disabled = true; msg.innerHTML = '';
  const { error } = await sb.auth.signInWithPassword({ email: d.email, password: d.password });
  btn.disabled = false;
  if (error) msg.innerHTML = `<div class="err">${esc(loginError(error))}</div>`;
});
function loginError(error) {
  const m = errMsg(error);
  if (/invalid login credentials/i.test(m)) return 'E-Mail oder Passwort ist falsch. Passwort vergessen? Die Leitung kann dir ein neues geben.';
  if (/email not confirmed/i.test(m)) return 'Die E-Mail-Adresse ist noch nicht bestätigt. Bitte den Admin fragen.';
  if (/rate limit/i.test(m)) return 'Zu viele Versuche. Bitte kurz warten.';
  return 'Anmeldung fehlgeschlagen: ' + m;
}

$('#fRegister').addEventListener('submit', async e => {
  e.preventDefault(); const f = e.target; const d = formData(f); const btn = $('button', f); const msg = $('#regMsg');
  btn.disabled = true; msg.innerHTML = '';
  const { data, error } = await sb.auth.signUp({ email: d.email, password: d.password, options: { data: { name: d.name, code: d.code } } });
  btn.disabled = false;
  if (error) {
    const m = errMsg(error);
    let t = 'Registrierung fehlgeschlagen: ' + m;
    if (/database error/i.test(m) || /einladungscode/i.test(m)) t = 'Der Einladungscode ist falsch. Bitte beim Admin nachfragen.';
    else if (/already registered|already exists/i.test(m)) t = 'Für diese E-Mail gibt es schon einen Zugang. Bitte anmelden.';
    else if (/password/i.test(m)) t = 'Das Passwort ist zu kurz oder zu einfach (mind. 6 Zeichen).';
    msg.innerHTML = `<div class="err">${esc(t)}</div>`; return;
  }
  if (data && data.user && !data.session) {
    if (data.user.identities && data.user.identities.length === 0) { msg.innerHTML = '<div class="err">Für diese E-Mail gibt es schon einen Zugang. Bitte anmelden.</div>'; return; }
    msg.innerHTML = '<div class="ok">Registriert. Bitte E-Mail bestätigen oder beim Admin melden.</div>';
  }
});

/* ============================================================
   Daten laden
   ============================================================ */
async function loadAll() {
  if (loading) { loadAgain = true; return; }
  loading = true;
  try {
    const from = iso(weekStart), to = iso(addDays(weekStart, 6));
    const reqs = [
      sb.from('groups').select('*').order('sort_order').order('name'),
      sb.from('employees').select('*').order('sort_order').order('name'),
      sb.from('shifts').select('*').gte('day', from).lte('day', to),
      sb.from('day_roles').select('*').gte('day', from).lte('day', to),
      sb.from('settings').select('*'),
      sb.from('absences').select('*').lte('from_day', to).gte('to_day', from),
    ];
    if (!isAdmin) reqs.push(sb.rpc('absences_public', { p_from: from, p_to: to }));
    const res = await Promise.all(reqs);
    const bad = res.find(r => r.error);
    if (bad) { toast('Fehler beim Laden: ' + errMsg(bad.error), 5000); console.error(bad.error); }
    S.groups = res[0].data || []; S.employees = res[1].data || []; S.shifts = res[2].data || []; S.roles = res[3].data || [];
    S.settings = Object.fromEntries((res[4].data || []).map(r => [r.key, r.value]));
    S.absences = res[5].data || [];
    S.absPublic = isAdmin ? [] : ((res[6] && res[6].data) || []);
    if (isAdmin && view === 'logins') await loadProfiles();
    if (view === 'absences') await loadAbsList();
    if (isAdmin && view === 'hours') await loadHours();
    render();
  } catch (e) { console.error(e); toast('Fehler: ' + errMsg(e), 5000); }
  loading = false;
  if (loadAgain) { loadAgain = false; loadAll(); }
}
async function loadProfiles() {
  // Erst die Login-Liste vom Server (E-Mail, letzte Anmeldung; legt fehlende Profile an), dann die Profile
  const r = await adminFn({ action: 'list' });
  S.users = r.ok ? Object.fromEntries((r.users || []).map(u => [u.id, u])) : null; S.usersErr = r.ok ? '' : r.error;
  const { data } = await sb.from('profiles').select('*').order('display_name'); S.profiles = data || [];
  const ps = await sb.from('push_subscriptions').select('user_id'); S.pushByUser = {}; for (const row of (ps.data || [])) S.pushByUser[row.user_id] = (S.pushByUser[row.user_id] || 0) + 1;
}
/* Ruft eine Server-Funktion auf (Logins verwalten, Benachrichtigen). Gibt immer { ok, ... } zurück. */
const adminFn = body => fnCall('admin-users', body);
async function fnCall(name, body) {
  try {
    const { data, error } = await sb.functions.invoke(name, { body });
    if (error) {
      let msg = errMsg(error);
      try { const ctx = error.context; if (ctx && typeof ctx.json === 'function') { const j = await ctx.json(); if (j && j.error) msg = j.error; } } catch (x) { }
      if (/failed to send|failed to fetch|networkerror/i.test(msg)) msg = 'Keine Verbindung zum Server. Internetverbindung prüfen.';
      return { ok: false, error: msg };
    }
    if (data && data.error) return { ok: false, error: data.error };
    return Object.assign({ ok: true }, data || {});
  } catch (e) { return { ok: false, error: errMsg(e) }; }
}
function genPw() { const a = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const arr = new Uint32Array(10); crypto.getRandomValues(arr); return Array.from(arr, n => a[n % a.length]).join(''); }
function userEmail(uid) { const u = S.users && S.users[uid]; const p = S.profiles.find(x => x.user_id === uid); return (u && u.email) || (uid === session.user.id ? session.user.email : '') || (p && p.display_name) || uid; }

/* ---------- Push-Benachrichtigungen (Gerät anmelden / abmelden) ---------- */
const pushApi = window.__pushApi || {
  supported() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; },
  permission() { return Notification.permission; },
  requestPermission() { return Notification.requestPermission(); },
  async getSubscription() { const r = await navigator.serviceWorker.ready; return r.pushManager.getSubscription(); },
  async subscribe(key) { const r = await navigator.serviceWorker.ready; const raw = atob(key.replace(/-/g, '+').replace(/_/g, '/')); const k = Uint8Array.from(raw, c => c.charCodeAt(0)); return r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: k }); },
  async unsubscribe() { const s = await this.getSubscription(); if (s) await s.unsubscribe(); return !!s; },
};
const PUSH = {
  iosNeedsInstall() { const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); const standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); return ios && !standalone; },
  row(sub) { const j = sub.toJSON ? sub.toJSON() : sub; return { user_id: session.user.id, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, user_agent: navigator.userAgent.slice(0, 200) }; },
  async state() {
    if (!pushApi.supported()) return { code: 'unsupported', text: 'Auf diesem Gerät bzw. in diesem Browser nicht verfügbar.' };
    if (this.iosNeedsInstall()) return { code: 'install', text: 'Auf dem iPhone zuerst die App zum Home-Bildschirm hinzufügen (Anleitung unten) und von dort öffnen – dann hier einschalten.' };
    if (pushApi.permission() === 'denied') return { code: 'denied', text: 'Für diese App sind Benachrichtigungen im Handy/Browser blockiert. Dort unter Einstellungen → Benachrichtigungen erlauben, dann hier einschalten.' };
    const sub = await pushApi.getSubscription().catch(() => null);
    return sub ? { code: 'on', text: 'Eingeschaltet auf diesem Gerät.' } : { code: 'off', text: 'Ausgeschaltet. Du erfährst nichts von Planänderungen, bis du sie einschaltest.' };
  },
  async enable() {
    const perm = await pushApi.requestPermission();
    if (perm !== 'granted') return { ok: false, error: 'Benachrichtigungen wurden nicht erlaubt.' };
    try {
      await pushApi.unsubscribe(); // frisch anmelden, damit dieses Gerät sicher zu diesem Login gehört
      const sub = await pushApi.subscribe(VAPID_PUBLIC_KEY);
      const { error } = await sb.from('push_subscriptions').upsert(this.row(sub), { onConflict: 'endpoint' });
      if (error) return { ok: false, error: errMsg(error) };
      return { ok: true };
    } catch (e) { return { ok: false, error: errMsg(e) }; }
  },
  async disable() {
    try {
      const sub = await pushApi.getSubscription();
      if (sub) { const ep = (sub.toJSON ? sub.toJSON() : sub).endpoint; await sb.from('push_subscriptions').delete().eq('endpoint', ep); await pushApi.unsubscribe(); }
      return { ok: true };
    } catch (e) { return { ok: false, error: errMsg(e) }; }
  },
  async sync() { // beim Start: bestehendes Abo dieses Geräts dem aktuellen Login zuordnen (still)
    try { if (!pushApi.supported() || pushApi.permission() !== 'granted') return; const sub = await pushApi.getSubscription(); if (sub) await sb.from('push_subscriptions').upsert(this.row(sub), { onConflict: 'endpoint' }); } catch (e) { }
  },
};
function monthRange(offset) { const d = new Date(); const from = new Date(d.getFullYear(), d.getMonth() + offset, 1); const to = new Date(d.getFullYear(), d.getMonth() + offset + 1, 0); return { from: iso(from), to: iso(to) }; }
async function loadHours() {
  const r = S.hoursRange || (S.hoursRange = monthRange(0));
  const [a, b] = await Promise.all([sb.from('shifts').select('*').gte('day', r.from).lte('day', r.to), sb.from('absences').select('*').lte('from_day', r.to).gte('to_day', r.from)]);
  if (a.error || b.error) toast('Fehler beim Laden: ' + errMsg(a.error || b.error), 5000);
  S.hoursShifts = a.data || []; S.hoursAbs = b.data || [];
}
async function loadAbsList() { const { data } = await sb.from('absences').select('*').gte('to_day', iso(addDays(new Date(), -60))).order('from_day', { ascending: false }); S.absList = data || []; }

let reloadTimer = null;
function scheduleReload() { clearTimeout(reloadTimer); reloadTimer = setTimeout(loadAll, 400); }
function setupRealtime() {
  if (rt) return;
  rt = sb.channel('plan-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'settings' }, scheduleReload)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'shifts' }, scheduleReload)
    .subscribe(status => { const d = $('#syncdot'); if (d) d.classList.toggle('off', status !== 'SUBSCRIBED'); });
  setInterval(() => { if (document.visibilityState === 'visible' && session) loadAll(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && session) loadAll(); });
}

/* ============================================================
   Abgeleitete Daten
   ============================================================ */
function days() { const n = Math.min(7, Math.max(5, +S.settings.days_per_week || 5)); return Array.from({ length: n }, (_, i) => { const d = addDays(weekStart, i); return { i, date: d, iso: iso(d), label: DAY_LABELS(i), long: DAY_LONG[i] }; }); }
function empById(id) { return S.employees.find(e => e.id === id); }
function shiftOf(empId, day) { return S.shifts.find(s => s.employee_id === empId && s.day === day); }
function absOf(empId, day) {
  const a = S.absences.find(x => x.employee_id === empId && x.from_day <= day && x.to_day >= day);
  if (a) return Object.assign({ known: true }, a);
  const p = S.absPublic.find(x => x.employee_id === empId && x.from_day <= day && x.to_day >= day);
  if (p) return { employee_id: empId, kind: null, known: false };
  return null;
}
function roleOf(day, role) { const r = S.roles.find(x => x.day === day && x.role === role); return r ? empById(r.employee_id) : null; }
function hasTimes(s) { return !!(s && ((s.start1 && s.end1) || (s.start2 && s.end2))); }
function shiftHours(s) { let h = 0; if (s.start1 && s.end1) h += (mins(s.end1) - mins(s.start1)) / 60; if (s.start2 && s.end2) h += (mins(s.end2) - mins(s.start2)) / 60; return Math.max(0, h); }
function weekHours(emp) { return days().reduce((sum, d) => { const s = shiftOf(emp.id, d.iso); if (!s || absOf(emp.id, d.iso)) return sum; return sum + shiftHours(s); }, 0); }
function isChanged(s) { const cd = +S.settings.change_days; if (!(cd > 0)) return false; return s && s.updated_at && (Date.now() - new Date(s.updated_at).getTime()) < cd * 86400000; }
function isNew(s) { return !!(s && lastSeen && s.updated_at && new Date(s.updated_at).getTime() > lastSeen); }
function countWorking(day) { return S.employees.filter(e => e.active !== false && hasTimes(shiftOf(e.id, day)) && !absOf(e.id, day)).length; }
function sections() {
  const active = S.employees.filter(e => e.active !== false);
  const out = S.groups.map(g => ({ g, emps: active.filter(e => e.group_id === g.id) })).filter(x => x.emps.length);
  const rest = active.filter(e => !S.groups.some(g => g.id === e.group_id));
  if (rest.length) out.push({ g: { id: 0, name: 'Ohne Gruppe', color: '#e5e7eb' }, emps: rest });
  return out;
}
function hoursVisible(emp) { const v = S.settings.hours_visibility || 'admin'; if (isAdmin || v === 'all') return true; if (v === 'own') return !!(emp && profile && profile.employee_id === emp.id); return false; }
function hoursColumn() { const v = S.settings.hours_visibility || 'admin'; return isAdmin || v !== 'admin'; }
function timeCls(t, kind) {
  const v = t5(t);
  if (kind === 'start' && v === t5(S.settings.early_time)) return 'early';
  if (kind === 'end' && v === t5(S.settings.late_time)) return 'late';
  if (kind === 'end' && v === t5(S.settings.warn_time)) return 'warn';
  return '';
}

/* ============================================================
   Rendern
   ============================================================ */
function render() {
  $('#title').innerHTML = `<span id="syncdot" title="Live-Verbindung"></span>${esc(S.settings.title || 'Schaffplang')}`;
  const D = days();
  $('#weekLabel').innerHTML = `KW ${isoWeek(weekStart)}<small>${fmtD(weekStart)} – ${fmtDY(addDays(weekStart, D.length - 1))}</small>`;
  $$('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  $('#weeknav').classList.toggle('hidden', view !== 'plan');
  if (!isAdmin && view !== 'plan' && view !== 'absences') view = 'plan';
  const c = $('#content');
  if (view === 'plan') c.innerHTML = renderPlan(D);
  else if (view === 'absences') c.innerHTML = renderAbsences();
  else if (view === 'employees') c.innerHTML = renderEmployees();
  else if (view === 'logins') c.innerHTML = renderLogins();
  else if (view === 'settings') c.innerHTML = renderSettings();
  else if (view === 'hours') c.innerHTML = renderHours();
}

function cellHtml(emp, d) {
  const s = shiftOf(emp.id, d.iso); const a = absOf(emp.id, d.iso);
  const cls = ['cell']; let inner = '';
  if (a) {
    const label = a.known ? (KINDS[a.kind] || 'Abwesend') : 'Abwesend';
    cls.push('abs', 'abs-' + (a.known ? a.kind : 'x'));
    inner = `<span class="abslbl">${esc(label)}</span>${a.known && a.note ? `<small>${esc(a.note)}</small>` : ''}`;
  } else if (s) {
    const parts = [];
    const blocks = [[s.start1, s.end1], [s.start2, s.end2]].filter(b => b[0] && b[1]).sort((x, y) => mins(x[0]) - mins(y[0]));
    for (const [st, en] of blocks) parts.push(`<span class="t"><b class="${timeCls(st, 'start')}">${fmtT(st)}</b>–<b class="${timeCls(en, 'end')}">${fmtT(en)}</b></span>`);
    if (s.note) parts.push(`<small class="note">${esc(s.note)}</small>`);
    inner = parts.join('');
    if (isChanged(s)) cls.push('chg');
    if (isNew(s)) cls.push('new');
  }
  const badges = [];
  const acc = roleOf(d.iso, 'accueil'), schl = roleOf(d.iso, 'schluss');
  if (acc && acc.id === emp.id) badges.push('<i class="badge acc">Accueil</i>');
  if (schl && schl.id === emp.id) badges.push('<i class="badge schl">Schluss</i>');
  const act = isAdmin ? `data-action="edit" data-emp="${emp.id}" data-day="${d.iso}"` : '';
  return `<div class="${cls.join(' ')}" ${act}>${inner}${badges.join('')}</div>`;
}

function renderPlan(D) {
  const secs = sections();
  let h = '';
  if (isAdmin) h += renderWarnings(D);
  if (selDay >= D.length) selDay = 0;
  h += `<div class="daytabs">${D.map(d => `<button class="${d.i === selDay ? 'active' : ''} ${d.iso === todayIso() ? 'istoday' : ''}" data-action="selday" data-i="${d.i}">${d.label}<small>${fmtD(d.date)}</small></button>`).join('')}</div>`;
  h += renderMyWeek(D);
  h += `<div class="daylist">${renderDayList(D[selDay], secs)}</div>`;
  h += `<div class="gridwrap"><table class="grid">${renderGrid(D, secs)}</table></div>`;
  h += `<div class="planactions admin-only"><button class="ghost" data-action="copyweek">Woche kopieren…</button><button class="ghost" data-action="notify">Benachrichtigen…</button><button class="ghost" data-action="print">Drucken</button><span style="flex:1"></span><button class="danger" data-action="clearweek">Woche leeren…</button></div>`;
  if (!S.employees.length) h += `<div class="card">Noch keine Mitarbeiter angelegt.${isAdmin ? ' Gehe zu „Mitarbeiter“, um zu starten.' : ''}</div>`;
  return h;
}

function renderMyWeek(D) {
  if (!profile || !profile.employee_id) return '';
  const e = empById(profile.employee_id); if (!e) return '';
  const target = +e.weekly_hours || 0;
  return `<div class="mycard"><div class="myhead"><span>Meine Woche – ${esc(e.name)}</span>${hoursVisible(e) ? `<small>${fmtH(weekHours(e))} h${target ? ` / ${fmtH(target)} h` : ''}</small>` : ''}</div><div class="mydays">${D.map(d => `<div class="myday ${d.iso === todayIso() ? 'today' : ''}"><b>${d.label}</b><small>${fmtD(d.date)}</small>${cellHtml(e, d)}</div>`).join('')}</div></div>`;
}

function renderDayList(d, secs) {
  const acc = roleOf(d.iso, 'accueil'), schl = roleOf(d.iso, 'schluss');
  let h = `<div class="dayhead"><div><b>${d.long}</b> ${fmtDY(d.date)} <small>· ${countWorking(d.iso)} Personen</small></div>
    <div class="roles" ${isAdmin ? `data-action="editroles" data-day="${d.iso}"` : ''}><span>Accueil: <b>${acc ? esc(acc.name) : '–'}</b></span><span>Schluss: <b>${schl ? esc(schl.name) : '–'}</b></span>${isAdmin ? '<span class="pen">✎</span>' : ''}</div>
    <label class="opts"><input type="checkbox" data-action="onlyworking" ${onlyWorking ? 'checked' : ''}> nur Anwesende</label></div>`;
  for (const { g, emps } of secs) {
    const rows = emps.filter(e => !onlyWorking || hasTimes(shiftOf(e.id, d.iso)) || absOf(e.id, d.iso) || (shiftOf(e.id, d.iso) || {}).note);
    if (!rows.length) continue;
    h += `<div class="grpcard" style="--gc:${esc(g.color)}"><div class="grphead">${esc(g.name)}</div>`;
    for (const e of rows) {

    }
    h += '</div>';
  }
  return h;
}

function renderGrid(D, secs) {

function computeWarnings(D) {
  const w = [];
  for (const d of D) {
    const acc = roleOf(d.iso, 'accueil'), schl = roleOf(d.iso, 'schluss');
    const early = t5(S.settings.early_time), late = t5(S.settings.late_time);
    if (!acc) w.push({ d, msg: 'Kein Accueil eingetragen' });
    else {
      const s = shiftOf(acc.id, d.iso);
      if (absOf(acc.id, d.iso)) w.push({ d, msg: `${acc.name} (Accueil) ist abwesend` });
      else if (early && !(s && [s.start1, s.start2].some(t => t5(t) === early))) w.push({ d, msg: `${acc.name} (Accueil) fängt nicht um ${fmtT(early)} an` });
    }
    if (!schl) w.push({ d, msg: 'Kein Schluss eingetragen' });
    else {
      const s = shiftOf(schl.id, d.iso);
      if (absOf(schl.id, d.iso)) w.push({ d, msg: `${schl.name} (Schluss) ist abwesend` });
      else if (late && !(s && [s.end1, s.end2].some(t => t5(t) === late))) w.push({ d, msg: `${schl.name} (Schluss) arbeitet nicht bis ${fmtT(late)}` });
    }
    for (const e of S.employees) {
      if (e.active === false) continue;
      const s = shiftOf(e.id, d.iso); if (!s) continue;
      const a = absOf(e.id, d.iso);
      if (a && hasTimes(s)) w.push({ d, msg: `${e.name}: Dienst eingetragen, aber abwesend (${KINDS[a.kind] || 'Abwesend'})`, info: true });
      if ((s.start1 && !s.end1) || (!s.start1 && s.end1) || (s.start2 && !s.end2) || (!s.start2 && s.end2)) w.push({ d, msg: `${e.name}: Zeit unvollständig (Von oder Bis fehlt)` });
      if (s.start1 && s.end1 && mins(s.end1) <= mins(s.start1)) w.push({ d, msg: `${e.name}: Ende liegt vor Beginn` });
      if (s.start2 && s.end2 && mins(s.end2) <= mins(s.start2)) w.push({ d, msg: `${e.name}: Ende (2. Block) liegt vor Beginn` });
    }
  }
  return w;
}
function renderWarnings(D) {
  const w = computeWarnings(D);
  if (!w.length) return '';
  return `<details class="warn"><summary>⚠ ${w.length} Hinweis${w.length === 1 ? '' : 'e'} für diese Woche</summary><ul>${w.map(x => `<li class="${x.info ? 'info' : ''}"><b>${x.d.label} ${fmtD(x.d.date)}</b> – ${esc(x.msg)}</li>`).join('')}</ul></details>`;
}

/* ---------- Stunden (Auswertung) ---------- */
function hoursReport() {
  const r = S.hoursRange; const n = Math.min(7, Math.max(5, +S.settings.days_per_week || 5));
  const days = []; for (let d = parseISO(r.from); iso(d) <= r.to; d = addDays(d, 1)) days.push(d);
  const workDays = days.filter(d => ((d.getDay() + 6) % 7) < n);
  const weeks = Array.from(new Set(workDays.map(d => iso(mondayOf(d))))).sort();
  const absAt = (empId, day) => S.hoursAbs.find(x => x.employee_id === empId && x.from_day <= day && x.to_day >= day);
  const rows = [];
  for (const e of S.employees.filter(x => x.active !== false)) {
    const row = { e, g: S.groups.find(g => g.id === e.group_id), total: 0, days: 0, weeks: {}, abs: { urlaub: 0, krank: 0, formatioun: 0, frei: 0, sonstiges: 0 } };
    for (const s of S.hoursShifts.filter(x => x.employee_id === e.id)) {
      if (absAt(e.id, s.day) || !hasTimes(s)) continue;
      const h = shiftHours(s); row.total += h; row.days++;
      const wk = iso(mondayOf(parseISO(s.day))); row.weeks[wk] = (row.weeks[wk] || 0) + h;
    }
    for (const d of workDays) { const a = absAt(e.id, iso(d)); if (a) row.abs[a.kind] = (row.abs[a.kind] || 0) + 1; }
    row.soll = (+e.weekly_hours || 0) / n * workDays.length;
    rows.push(row);
  }
  return { rows, weeks, workDays, n };
}
function renderHours() {
  const r = S.hoursRange || monthRange(0); S.hoursRange = r;
  const { rows, weeks, workDays } = hoursReport();
  const showWeeks = weeks.length >= 2 && weeks.length <= 8;
  const sum = { total: 0, days: 0, soll: 0, weeks: {}, abs: { urlaub: 0, krank: 0, formatioun: 0, frei: 0, sonstiges: 0 } };
  for (const x of rows) { sum.total += x.total; sum.days += x.days; sum.soll += x.soll; for (const k in x.abs) sum.abs[k] += x.abs[k]; for (const w of weeks) sum.weeks[w] = (sum.weeks[w] || 0) + (x.weeks[w] || 0); }
  const diff = v => { const d = Math.round(v * 100) / 100; return `<span style="color:${d > 0.01 ? 'var(--red)' : d < -0.01 ? 'var(--orange)' : 'inherit'}">${d > 0 ? '+' : ''}${fmtH(d)}</span>`; };
  let h = `<div class="card"><h2>Stunden laut Plan <span class="cnt">${fmtDS(r.from)} – ${fmtDS(r.to)} · ${workDays.length} Arbeitstage</span></h2>
    <form class="f" id="fHours"><div class="frow"><label>Von</label><input type="date" name="from" value="${esc(r.from)}" required><label style="min-width:auto">bis</label><input type="date" name="to" value="${esc(r.to)}" required><button class="primary" type="submit">Anzeigen</button></div>
    <div class="chips"><button type="button" data-action="hoursrange" data-r="week">Diese Woche</button><button type="button" data-action="hoursrange" data-r="month">Dieser Monat</button><button type="button" data-action="hoursrange" data-r="lastmonth">Letzter Monat</button><button type="button" data-action="hoursrange" data-r="nextmonth">Nächster Monat</button><span class="spacer"></span><button type="button" data-action="hourscsv">Als CSV speichern</button></div></form>
    <div style="overflow:auto"><table class="list" id="tblHours"><thead><tr><th>Name</th><th>Gruppe</th>${showWeeks ? weeks.map(w => `<th title="ab ${fmtDS(w)}">KW ${isoWeek(parseISO(w))}</th>`).join('') : ''}<th>Stunden</th><th>Tage</th><th>Congé</th><th>Krank</th><th>Formatioun</th><th>Fräi/Sonst.</th><th>Soll</th><th>Differenz</th></tr></thead><tbody>`;
  for (const x of rows) h += `<tr><td><b>${esc(x.e.name)}</b></td><td>${x.g ? esc(x.g.name) : '–'}</td>${showWeeks ? weeks.map(w => `<td>${x.weeks[w] ? fmtH(x.weeks[w]) : ''}</td>`).join('') : ''}<td><b>${fmtH(x.total)}</b></td><td>${x.days}</td><td>${x.abs.urlaub || ''}</td><td>${x.abs.krank || ''}</td><td>${x.abs.formatioun || ''}</td><td>${(x.abs.frei + x.abs.sonstiges) || ''}</td><td>${x.soll ? fmtH(x.soll) : ''}</td><td>${x.soll ? diff(x.total - x.soll) : ''}</td></tr>`;

function hoursCsv() {

const PDF_LIBS = ['https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js', 'https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js'];
function loadScript(src) { return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = () => rej(new Error('Laden fehlgeschlagen: ' + src)); document.head.appendChild(el); }); }
async function loadPdfLibs() {
  if (!(window.jspdf && window.jspdf.jsPDF)) await loadScript(PDF_LIBS[0]);
  if (!window.jspdf.jsPDF.API.autoTable) await loadScript(PDF_LIBS[1]);
}
let logoData = null;
async function loadLogo() { // Logo als Daten-URL für das PDF (einmal laden, dann merken)
  if (logoData !== null) return logoData;
  try { const b = await (await fetch('logo.png')).blob(); logoData = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); }); }
  catch (e) { logoData = ''; }
  return logoData;
}
function hexRgb(hex) { const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim()); if (!m) return [229, 231, 235]; const n = parseInt(m[1], 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
const PDF_COL = { red: [208, 2, 27], orange: [233, 113, 50], text: [27, 36, 48], note: [61, 74, 92], acc: [21, 96, 130], schl: [14, 40, 65] };
const ABS_COL = { urlaub: [[251, 213, 213], [138, 28, 28]], krank: [[251, 213, 213], [138, 28, 28]], formatioun: [[255, 224, 179], [122, 75, 0]], frei: [[229, 231, 235], [75, 85, 99]], sonstiges: [[232, 220, 242], [74, 43, 106]], x: [[232, 220, 242], [74, 43, 106]] };
function pdfCellInfo(emp, d) {
  const s = shiftOf(emp.id, d.iso); const a = absOf(emp.id, d.iso); const lines = [];
  if (a) { const k = a.known ? a.kind : 'x'; const label = a.known ? (KINDS[a.kind] || 'Abwesend') : 'Abwesend'; const col = ABS_COL[k] || ABS_COL.x; return { abs: true, absColor: col[0], absText: col[1], text: label + (a.known && a.note ? '\n' + a.note : ''), lines }; }
  if (s) {
    const blocks = [[s.start1, s.end1], [s.start2, s.end2]].filter(b => b[0] && b[1]).sort((x, y) => mins(x[0]) - mins(y[0]));
    for (const [st, en] of blocks) { const cs = timeCls(st, 'start'), ce = timeCls(en, 'end'); lines.push({ segs: [{ t: fmtT(st), color: cs ? PDF_COL.red : null, bold: true }, { t: '–' }, { t: fmtT(en), color: ce === 'warn' ? PDF_COL.orange : ce ? PDF_COL.red : null, bold: true }] }); }
    if (s.note) lines.push({ segs: [{ t: String(s.note).toUpperCase(), color: PDF_COL.note, small: true }] });
  }
  const acc = roleOf(d.iso, 'accueil'), schl = roleOf(d.iso, 'schluss');
  if (acc && acc.id === emp.id) lines.push({ segs: [{ t: '» Accueil', color: PDF_COL.acc, bold: true, small: true }] });
  if (schl && schl.id === emp.id) lines.push({ segs: [{ t: '» Schluss', color: PDF_COL.schl, bold: true, small: true }] });
  return { abs: false, lines, text: lines.map(l => l.segs.map(x => x.t).join('')).join('\n') };
}
function pdfDrawLines(doc, cell, lines, fs) {
  const k = doc.internal.scaleFactor; const lh = fs * 1.15 / k;
  const inner = cell.height - cell.padding('top') - cell.padding('bottom');
  let y = cell.y + cell.padding('top') + Math.max(0, (inner - lines.length * lh) / 2);
  for (const line of lines) {
    let x = cell.x + cell.padding('left');
    for (const sg of line.segs) { doc.setFontSize(sg.small ? fs - 1 : fs); doc.setFont('helvetica', sg.bold ? 'bold' : 'normal'); const c = sg.color || PDF_COL.text; doc.setTextColor(c[0], c[1], c[2]); doc.text(sg.t, x, y + (sg.small ? 0.25 : 0), { baseline: 'top' }); x += doc.getTextWidth(sg.t); }
    y += lh;
  }
  doc.setFontSize(fs); doc.setFont('helvetica', 'normal'); doc.setTextColor(0, 0, 0);
}
async function exportWeekPdf() {
  if (!S.employees.length) return toast('Keine Daten für den PDF-Export.');
  toast('PDF wird erstellt…', 2500);
  try { await loadPdfLibs(); } catch (e) { return toast('PDF-Funktion konnte nicht geladen werden. Internetverbindung prüfen und erneut versuchen.', 6000); }
  const logo = await loadLogo();
  const { jsPDF } = window.jspdf; const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  let tx = 10; if (logo) { try { doc.addImage(logo, 'PNG', 10, 3.5, 32, 10.4); tx = 46; } catch (e) { } }
  const D = days(); const secs = sections(); const showH = hoursColumn(); const fs = 7.5; const nCols = 1 + D.length + (showH ? 1 : 0);
  const now = new Date();
  doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(14, 40, 65);
  doc.text(`${S.settings.title || 'Schaffplang'} – KW ${isoWeek(weekStart)} (${fmtD(weekStart)} – ${fmtDY(addDays(weekStart, D.length - 1))})`, tx, 11);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(110, 110, 110);
  doc.text(`Stand: ${fmtDY(now)} ${pad2(now.getHours())}:${pad2(now.getMinutes())}`, 287, 11, { align: 'right' }); doc.setTextColor(0, 0, 0);
  const head = [['Name', ...D.map(d => `${d.label} ${fmtD(d.date)}`), ...(showH ? ['Std.'] : [])]];
  const body = [], meta = [];
  for (const { g, emps } of secs) {
    body.push([{ content: g.name, colSpan: nCols }]); meta.push({ type: 'grp', g });
    for (const e of emps) {
      const info = D.map(d => pdfCellInfo(e, d)); const row = [e.name, ...info.map(c => c.text)];
      if (showH) { const wh = weekHours(e), t = +e.weekly_hours || 0; row.push(hoursVisible(e) ? fmtH(wh) + (t ? ' / ' + fmtH(t) : '') : ''); }
      body.push(row); meta.push({ type: 'emp', e, g, info });
    }
  }
  for (const role of ['accueil', 'schluss']) { body.push([role === 'accueil' ? 'Accueil' : 'Schluss', ...D.map(d => { const r = roleOf(d.iso, role); return r ? r.name : '–'; }), ...(showH ? [''] : [])]); meta.push({ type: 'role' }); }
  body.push(['Personen', ...D.map(d => String(countWorking(d.iso))), ...(showH ? [''] : [])]); meta.push({ type: 'count' });

  doc.autoTable({

    styles: { fontSize: fs, cellPadding: 1.2, lineColor: [205, 210, 218], lineWidth: 0.15, valign: 'middle', overflow: 'linebreak', textColor: PDF_COL.text },
    headStyles: { fillColor: [14, 40, 65], textColor: 255, halign: 'center', fontStyle: 'bold' }, columnStyles: colStyles,
    didParseCell: data => {
      const m = meta[data.row.index]; if (data.section !== 'body' || !m) return;
      if (m.type === 'grp') { data.cell.styles.fillColor = hexRgb(m.g.color); data.cell.styles.fontStyle = 'bold'; data.cell.styles.cellPadding = 0.9; }
      else if (m.type === 'emp') {
        if (data.column.index === 0) data.cell.styles.fillColor = hexRgb(m.e.color || m.g.color);
        else if (data.column.index <= D.length) { const c = m.info[data.column.index - 1]; if (c.abs) { data.cell.styles.fillColor = c.absColor; data.cell.styles.textColor = c.absText; data.cell.styles.fontStyle = 'bold'; } }
      }
      else { data.cell.styles.fillColor = [247, 249, 251]; data.cell.styles.halign = data.column.index === 0 ? 'left' : 'center'; if (data.column.index === 0) data.cell.styles.fontStyle = 'bold'; if (m.type === 'count') data.cell.styles.textColor = [107, 116, 128]; }
    },
    willDrawCell: data => { const m = meta[data.row.index]; if (data.section === 'body' && m && m.type === 'emp' && data.column.index >= 1 && data.column.index <= D.length && !m.info[data.column.index - 1].abs) data.cell.text = []; },
    didDrawCell: data => { const m = meta[data.row.index]; if (data.section === 'body' && m && m.type === 'emp' && data.column.index >= 1 && data.column.index <= D.length) { const c = m.info[data.column.index - 1]; if (!c.abs && c.lines.length) pdfDrawLines(doc, data.cell, c.lines, fs); } },
  });

  doc.save(`Schaffplang_KW${isoWeek(weekStart)}_${iso(weekStart)}.pdf`);
}

  openModal(`<h3>${id ? 'Mitarbeiter bearbeiten' : 'Neuer Mitarbeiter'}</h3><form class="f" id="fEmp">
    <div class="frow"><label>Name</label><input type="text" name="name" value="${esc(e.name)}" required></div>
    <div class="frow"><label>Gruppe</label><select name="group_id"><option value="">– keine –</option>${S.groups.map(g => `<option value="${g.id}" ${e.group_id === g.id ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select></div>
    <div class="frow"><label>Std./Woche</label><input type="number" name="weekly_hours" step="0.5" min="0" max="60" value="${esc(e.weekly_hours)}"></div>
    <div class="frow"><label>Reihenfolge</label><input type="number" name="sort_order" step="1" value="${esc(e.sort_order)}"></div>
    <div class="frow"><label>Eigene Farbe</label><input type="color" name="color" value="${esc(e.color || '#a6c9ed')}"><label class="check" style="min-width:auto"><input type="checkbox" name="use_color" ${e.color ? 'checked' : ''}> Farbe verwenden (Name hervorheben)</label></div>
    <label class="check"><input type="checkbox" name="active" ${e.active !== false ? 'checked' : ''}> Aktiv (im Plan sichtbar)</label>
    <div class="actions"><button class="primary" type="submit">Speichern</button><span class="spacer"></span>${id ? `<button type="button" class="danger" data-action="delemp" data-id="${id}">Löschen</button>` : ''}<button type="button" class="ghost" data-action="closemodal">Abbrechen</button></div></form>`);
  $('#fEmp').addEventListener('submit', async ev => {
    ev.preventDefault(); const d = formData(ev.target); const f = ev.target;
    const row = { name: d.name, group_id: d.group_id ? +d.group_id : null, weekly_hours: +d.weekly_hours || 0, sort_order: +d.sort_order || 0, active: f.active.checked, color: f.use_color.checked ? d.color : null };
    const { error } = id ? await sb.from('employees').update(row).eq('id', id) : await sb.from('employees').insert(row);
    if (error) return toast('Speichern fehlgeschlagen: ' + errMsg(error), 5000);
    closeModal(); toast('Gespeichert'); loadAll();

}

function openGroupEditor(id) {
  const g = id ? S.groups.find(x => x.id === id) : { name: '', color: '#c7d0dd', sort_order: (Math.max(0, ...S.groups.map(x => x.sort_order || 0)) + 1), staff_visible: true };
  openModal(`<h3>${id ? 'Gruppe bearbeiten' : 'Neue Gruppe'}</h3><form class="f" id="fGroup">
    <div class="frow"><label>Name</label><input type="text" name="name" value="${esc(g.name)}" required></div>
    <div class="frow"><label>Farbe</label><input type="color" name="color" value="${esc(g.color)}"><small>helle Farben sind am besten lesbar</small></div>

    <div class="actions"><button class="primary" type="submit">Speichern</button><span class="spacer"></span>${id ? `<button type="button" class="danger" data-action="delgroup" data-id="${id}">Löschen</button>` : ''}<button type="button" class="ghost" data-action="closemodal">Abbrechen</button></div></form>`);

function openCopyWeek() {
  const opts = [];
  for (let k = -8; k <= 8; k++) { if (k === 0) continue; const ws = addDays(weekStart, k * 7); opts.push(`<option value="${iso(ws)}" ${k === -1 ? 'selected' : ''}>KW ${isoWeek(ws)} (${fmtD(ws)} – ${fmtDY(addDays(ws, 6))})</option>`); }
  openModal(`<h3>Woche kopieren<small>nach KW ${isoWeek(weekStart)} (${fmtD(weekStart)} – ${fmtDY(addDays(weekStart, 6))})</small></h3><form class="f" id="fCopy">
    <div class="frow"><label>Von Woche</label><select name="src">${opts.join('')}</select></div>
    <label class="check"><input type="checkbox" name="replace" checked> Vorhandene Einträge dieser Woche vorher löschen</label>
    <label class="check"><input type="checkbox" name="roles" checked> Accueil &amp; Schluss mitkopieren</label>
    <p class="help">Abwesenheiten werden nicht kopiert.</p>
    <div class="actions"><button class="primary" type="submit">Kopieren</button><button type="button" class="ghost" data-action="closemodal">Abbrechen</button></div></form>`);
  $('#fCopy').addEventListener('submit', async ev => {
    ev.preventDefault(); const f = ev.target; const btn = $('button.primary', f); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Kopiere…';
    try { await copyWeek(parseISO(f.src.value), f.replace.checked, f.roles.checked); closeModal(); toast('Woche kopiert'); loadAll(); }
    catch (e) { toast('Kopieren fehlgeschlagen: ' + errMsg(e), 6000); btn.disabled = false; btn.textContent = 'Kopieren'; }
  });
}
async function copyWeek(srcStart, replace, withRoles) {
  const sFrom = iso(srcStart), sTo = iso(addDays(srcStart, 6));
  const tFrom = iso(weekStart), tTo = iso(addDays(weekStart, 6));
  const [r1, r2] = await Promise.all([sb.from('shifts').select('*').gte('day', sFrom).lte('day', sTo), sb.from('day_roles').select('*').gte('day', sFrom).lte('day', sTo)]);
  if (r1.error) throw r1.error; if (r2.error) throw r2.error;
  const offset = Math.round((weekStart - srcStart) / 86400000);
  if (replace) {
    const d1 = await sb.from('shifts').delete().gte('day', tFrom).lte('day', tTo); if (d1.error) throw d1.error;
    if (withRoles) { const d2 = await sb.from('day_roles').delete().gte('day', tFrom).lte('day', tTo); if (d2.error) throw d2.error; }
  }
  const rows = (r1.data || []).filter(s => s.start1 || s.start2 || s.note).map(s => ({ employee_id: s.employee_id, day: iso(addDays(parseISO(s.day), offset)), start1: s.start1, end1: s.end1, start2: s.start2, end2: s.end2, note: s.note }));
  if (rows.length) { const u = await sb.from('shifts').upsert(rows, { onConflict: 'employee_id,day' }); if (u.error) throw u.error; }
  if (withRoles) { const rr = (r2.data || []).filter(r => r.employee_id).map(r => ({ day: iso(addDays(parseISO(r.day), offset)), role: r.role, employee_id: r.employee_id })); if (rr.length) { const u = await sb.from('day_roles').upsert(rr, { onConflict: 'day,role' }); if (u.error) throw u.error; } }
}

/* ---------- Mitarbeiter benachrichtigen (Admin) ---------- */
async function openNotify() {
  const ws = iso(weekStart); const kw = isoWeek(weekStart); const range = `${fmtD(weekStart)} – ${fmtDY(addDays(weekStart, days().length - 1))}`;
  openModal(`<h3>Mitarbeiter benachrichtigen<small>KW ${kw} · ${range}</small></h3><p class="help" id="notifyInfo">Prüfe, wer erreichbar ist…</p>`);
  const pv = await fnCall('notify', { action: 'preview', week_start: ws, mode: 'changed' });
  if (!pv.ok) { $('#notifyInfo').innerHTML = `<div class="err">Benachrichtigen ist gerade nicht möglich: ${esc(pv.error)}</div><div class="actions"><button type="button" class="ghost" data-action="closemodal">Schließen</button></div>`; return; }
  const fmtTs = ts => { const d = new Date(ts); return `${fmtDY(d)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
  const last = pv.last; const nChanged = pv.recipients_changed || 0;
  const defText = last ? `Der Plan für KW ${kw} (${range}) wurde geändert. Bitte anschauen.` : `Der Plan für KW ${kw} (${range}) ist da.`;
  const changedList = (pv.changed_employees || []).join(', ');
  $('#mbox').innerHTML = `<h3>Mitarbeiter benachrichtigen<small>KW ${kw} · ${range}</small></h3><form class="f" id="fNotify">
    <div class="noteinfo">Push eingeschaltet: <b>${pv.subscribed_users}</b> Login${pv.subscribed_users === 1 ? '' : 's'} (im Menü ☰ kann jeder Kollege es selbst einschalten). Letzte Benachrichtigung für diese Woche: <b>${last ? esc(fmtTs(last.sent_at)) + ' an ' + last.recipients + ' Person' + (last.recipients === 1 ? '' : 'en') : 'noch keine'}</b>.</div>
    <label class="check"><input type="radio" name="mode" value="changed" ${last ? 'checked' : 'disabled'}> Nur Betroffene: Änderungen seit der letzten Benachrichtigung${last ? ` – ${nChanged} Person${nChanged === 1 ? '' : 'en'} mit Push${changedList ? ` (geändert bei: ${esc(changedList)})` : ' (keine Änderungen gefunden)'}` : ' (erst nach der ersten Benachrichtigung möglich)'}</label>
    <label class="check"><input type="radio" name="mode" value="all" ${last ? '' : 'checked'}> Alle mit Push (${pv.subscribed_users})</label>
    <div class="frow"><label>Text</label><input type="text" name="text" required maxlength="200" value="${esc(defText)}"></div>
    <p class="help">Die Meldung erscheint auf dem Handy wie eine Nachricht; ein Tipp darauf öffnet die App bei KW ${kw}. Wer Push nicht eingeschaltet hat, bekommt nichts.</p>
    <div class="actions"><button class="primary" type="submit" ${pv.subscribed_users ? '' : 'disabled'}>Jetzt senden</button><button type="button" class="ghost" data-action="closemodal">Abbrechen</button></div></form>`;
  $('#fNotify').addEventListener('submit', async ev => {
    ev.preventDefault(); const d = formData(ev.target); const btn = $('button[type=submit]', ev.target); btn.disabled = true; btn.textContent = 'Sende…';
    const r = await fnCall('notify', { action: 'send', week_start: ws, mode: d.mode || 'all', text: d.text });
    if (!r.ok) { btn.disabled = false; btn.textContent = 'Jetzt senden'; return toast('Senden fehlgeschlagen: ' + r.error, 6000); }
    closeModal();
    if (!r.users) return toast('Niemand zu benachrichtigen (keine Betroffenen mit Push).', 5000);
    toast(`Gesendet an ${r.users} Person${r.users === 1 ? '' : 'en'}, ${r.delivered} zugestellt${r.failed ? `, ${r.failed} fehlgeschlagen` : ''}${r.removed ? ` (${r.removed} abgelaufene Geräte entfernt)` : ''}.`, 7000);
  });
}

function openMenu() {
  const e = profile.employee_id ? empById(profile.employee_id) : null;
  openModal(`<h3>Menü<small>Angemeldet als ${esc(profile.display_name || session.user.email)}${e ? ` · ${esc(e.name)}` : ''}${isAdmin ? ' · Admin' : ''}</small></h3>
    <div class="noteinfo" id="pushBox"><b>Benachrichtigung bei Planänderungen</b><p id="pushState" class="help" style="margin:6px 0">Prüfe…</p><div class="actions" style="margin-top:6px"><button type="button" class="primary sm hidden" data-action="pushon">Einschalten</button><button type="button" class="ghost sm hidden" data-action="pushoff">Ausschalten</button></div></div>
    <div class="help"><p><b>Auf dem Handy als App installieren:</b></p><ol><li><b>iPhone:</b> Diese Seite in Safari öffnen → Teilen-Symbol (Quadrat mit Pfeil) → „Zum Home-Bildschirm“.</li><li><b>Android:</b> In Chrome öffnen → Menü ⋮ → „App installieren“ oder „Zum Startbildschirm hinzufügen“.</li></ol></div>
    <form class="f"><div class="actions"><button type="button" class="ghost" data-action="changepw">Passwort ändern</button>${isAdmin ? '<button type="button" class="ghost" data-action="changeemail">E-Mail ändern</button>' : ''}<button type="button" class="ghost" data-action="reload">Neu laden</button><span class="spacer"></span><button type="button" class="danger" data-action="logout">Abmelden</button></div></form>`);
  refreshPushUi();
}
async function refreshPushUi() {
  const box = $('#pushBox'); if (!box) return;
  const st = await PUSH.state(); const p = $('#pushState'); if (!p) return;
  p.textContent = st.text;
  $('[data-action=pushon]', box).classList.toggle('hidden', st.code !== 'off');
  $('[data-action=pushoff]', box).classList.toggle('hidden', st.code !== 'on');
  box.dataset.state = st.code;
}
function openChangePw() {
  openModal(`<h3>Passwort ändern</h3><form class="f" id="fPw"><div class="frow"><label>Neues Passwort</label><input type="password" name="pw" minlength="6" required autocomplete="new-password"></div><div class="frow"><label>Wiederholen</label><input type="password" name="pw2" minlength="6" required autocomplete="new-password"></div>
    <div class="actions"><button class="primary" type="submit">Speichern</button><button type="button" class="ghost" data-action="closemodal">Abbrechen</button></div></form>`);
  $('#fPw').addEventListener('submit', async ev => {
    ev.preventDefault(); const d = formData(ev.target); if (d.pw !== d.pw2) return toast('Die Passwörter stimmen nicht überein.');
    const { error } = await sb.auth.updateUser({ password: d.pw }); if (error) return toast('Fehlgeschlagen: ' + errMsg(error), 5000);
    closeModal(); toast('Passwort geändert');
  });
}

/* ============================================================
   Ereignisse
   ============================================================ */
$('#prevWeek').addEventListener('click', () => { weekStart = addDays(weekStart, -7); render(); loadAll(); });
$('#nextWeek').addEventListener('click', () => { weekStart = addDays(weekStart, 7); render(); loadAll(); });
$('#todayWeek').addEventListener('click', () => { weekStart = mondayOf(new Date()); selDay = Math.min((new Date().getDay() + 6) % 7, days().length - 1); render(); loadAll(); });
$('#btnReload').addEventListener('click', () => { toast('Aktualisiere…', 1200); loadAll(); });
$('#btnPdf').addEventListener('click', exportWeekPdf);
$('#btnMenu').addEventListener('click', openMenu);
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; view = b.dataset.view; render(); loadAll(); });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

document.addEventListener('click', async e => {
  const fill = e.target.closest('[data-fill]');
  if (fill) { const form = fill.closest('form'); fill.dataset.fill.split('|').forEach(kv => { const i = kv.indexOf('='); const k = kv.slice(0, i), v = kv.slice(i + 1); if (form[k]) form[k].value = v; }); return; }
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action;
  if (a === 'selday') { selDay = +el.dataset.i; render(); }
  else if (a === 'edit') { if (isAdmin) openShiftEditor(+el.dataset.emp, el.dataset.day); }
  else if (a === 'editroles') { if (isAdmin) openRolesEditor(el.dataset.day); }
  else if (a === 'newabs') { openAbsenceEditor(null, el.dataset.emp ? +el.dataset.emp : null, el.dataset.day || null); }
  else if (a === 'editabs') openAbsenceEditor(+el.dataset.id);
  else if (a === 'delabs') { if (confirm('Diese Abwesenheit löschen?')) { const { error } = await sb.from('absences').delete().eq('id', +el.dataset.id); if (error) return toast('Löschen fehlgeschlagen: ' + errMsg(error), 5000); closeModal(); toast('Gelöscht'); loadAll(); } }
  else if (a === 'clearshift') { if (confirm('Eintrag für diesen Tag entfernen?')) { const { error } = await sb.from('shifts').update({ start1: null, end1: null, start2: null, end2: null, note: null }).eq('id', +el.dataset.id); if (error) return toast('Fehlgeschlagen: ' + errMsg(error), 5000); closeModal(); toast('Entfernt'); loadAll(); } }
  else if (a === 'newemp') openEmployeeEditor(null);
  else if (a === 'editemp') openEmployeeEditor(+el.dataset.id);
  else if (a === 'delemp') { const emp = empById(+el.dataset.id); if (confirm(`„${emp.name}“ wirklich löschen? Alle Dienste und Abwesenheiten dieser Person werden mitgelöscht. (Tipp: stattdessen „Aktiv“ abwählen.)`)) { const { error } = await sb.from('employees').delete().eq('id', emp.id); if (error) return toast('Löschen fehlgeschlagen: ' + errMsg(error), 5000); closeModal(); toast('Gelöscht'); loadAll(); } }
  else if (a === 'newgroup') openGroupEditor(null);
  else if (a === 'editgroup') openGroupEditor(+el.dataset.id);
  else if (a === 'delgroup') { if (confirm('Gruppe löschen? Die Mitarbeiter bleiben erhalten (ohne Gruppe).')) { const { error } = await sb.from('groups').delete().eq('id', +el.dataset.id); if (error) return toast('Löschen fehlgeschlagen: ' + errMsg(error), 5000); closeModal(); toast('Gelöscht'); loadAll(); } }
  else if (a === 'copyweek') openCopyWeek();
  else if (a === 'notify') openNotify();
  else if (a === 'clearweek') { if (confirm(`Alle Dienste sowie Accueil/Schluss der KW ${isoWeek(weekStart)} (${fmtD(weekStart)} – ${fmtDY(addDays(weekStart, 6))}) löschen? Abwesenheiten bleiben erhalten. Das kann nicht rückgängig gemacht werden.`)) { const f = iso(weekStart), t = iso(addDays(weekStart, 6)); const d1 = await sb.from('shifts').delete().gte('day', f).lte('day', t); const d2 = await sb.from('day_roles').delete().gte('day', f).lte('day', t); if (d1.error || d2.error) return toast('Löschen fehlgeschlagen: ' + errMsg(d1.error || d2.error), 5000); toast('Woche geleert'); loadAll(); } }
  else if (a === 'hoursrange') { const k = el.dataset.r; if (k === 'week') S.hoursRange = { from: iso(weekStart), to: iso(addDays(weekStart, days().length - 1)) }; else if (k === 'month') S.hoursRange = monthRange(0); else if (k === 'lastmonth') S.hoursRange = monthRange(-1); else if (k === 'nextmonth') S.hoursRange = monthRange(1); loadAll(); }
  else if (a === 'hourscsv') hoursCsv();
  else if (a === 'print') window.print();
  else if (a === 'closemodal') closeModal();
  else if (a === 'changepw') openChangePw();
  else if (a === 'changeemail') openSetEmail(session.user.id);
  else if (a === 'pushon') { el.disabled = true; const r = await PUSH.enable(); el.disabled = false; toast(r.ok ? 'Benachrichtigungen eingeschaltet' : 'Nicht eingeschaltet: ' + r.error, 5000); refreshPushUi(); }
  else if (a === 'pushoff') { el.disabled = true; const r = await PUSH.disable(); el.disabled = false; toast(r.ok ? 'Benachrichtigungen ausgeschaltet' : 'Fehlgeschlagen: ' + r.error, 5000); refreshPushUi(); }
  else if (a === 'newlogin') openNewLogin();
  else if (a === 'setpw') openSetPw(el.dataset.uid);
  else if (a === 'setemail') openSetEmail(el.dataset.uid);
  else if (a === 'deluser') { const email = userEmail(el.dataset.uid); if (confirm(`Login „${email}“ wirklich löschen? Die Person kann sich danach nicht mehr anmelden. Ihr Name im Plan, ihre Dienste und Abwesenheiten bleiben erhalten.`)) { const r = await adminFn({ action: 'delete_user', user_id: el.dataset.uid }); if (!r.ok) return toast('Löschen fehlgeschlagen: ' + r.error, 6000); toast('Login gelöscht'); await loadProfiles(); render(); } }
  else if (a === 'genpw') { const inp = el.parentElement.querySelector('input[name=password]'); if (inp) inp.value = genPw(); }
  else if (a === 'copytext') { const t = el.dataset.text; try { await navigator.clipboard.writeText(t); toast('Kopiert – z. B. in eine Nachricht einfügen'); } catch (x) { window.prompt('Zum Kopieren markieren:', t.replace(/\n/g, ' | ')); } }
  else if (a === 'reload') location.reload();
  else if (a === 'logout') { closeModal(); await sb.auth.signOut(); }
});

document.addEventListener('change', async e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action;
  if (a === 'setrole') { const err = await setRole(el.dataset.day, el.dataset.role, el.value); if (err) toast('Fehlgeschlagen: ' + errMsg(err), 5000); else { toast('Gespeichert'); loadAll(); } }
  else if (a === 'onlyworking') { onlyWorking = el.checked; try { localStorage.setItem('mr_onlyWorking', onlyWorking ? '1' : '0'); } catch (x) { } render(); }
  else if (a === 'absfilter') { S.absFilter = el.value; render(); }
  else if (a === 'linkprofile') { const { error } = await sb.from('profiles').update({ employee_id: el.value ? +el.value : null }).eq('user_id', el.dataset.uid); if (error) toast('Fehlgeschlagen: ' + errMsg(error), 5000); else { toast('Zugeordnet'); await loadProfiles(); render(); } }
  else if (a === 'setadmin') { const { error } = await sb.from('profiles').update({ is_admin: el.checked }).eq('user_id', el.dataset.uid); if (error) { toast('Fehlgeschlagen: ' + errMsg(error), 5000); el.checked = !el.checked; } else { toast(el.checked ? 'Ist jetzt Admin' : 'Admin-Recht entfernt'); await loadProfiles(); render(); } }
});

document.addEventListener('submit', async e => {
  if (e.target.id === 'fHours') { e.preventDefault(); const d = formData(e.target); if (!d.from || !d.to || d.to < d.from) return toast('„Bis“ darf nicht vor „Von“ liegen.'); S.hoursRange = { from: d.from, to: d.to }; loadAll(); return; }
  if (e.target.id !== 'fSettings') return;
  e.preventDefault(); const d = formData(e.target);
  const rows = ['title', 'early_time', 'late_time', 'warn_time', 'days_per_week', 'day_labels', 'change_days', 'invite_code', 'hours_visibility'].map(k => ({ key: k, value: d[k] ?? '' }));
  const { error } = await sb.from('settings').upsert(rows, { onConflict: 'key' });
  if (error) return toast('Speichern fehlgeschlagen: ' + errMsg(error), 5000);
  toast('Einstellungen gespeichert'); loadAll();
});

init();
